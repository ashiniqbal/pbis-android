plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pbisllc.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pbisllc.pos'
        minSdk 24
        targetSdk 34
        versionCode 130
        versionName '1.3.0'
    }

    signingConfigs {
        // Optional release signing from environment (CI secrets). Debug builds work without it.
        release {
            def ks = System.getenv('PBIS_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PBIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PBIS_KEY_ALIAS')
                keyPassword System.getenv('PBIS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PBIS_KEYSTORE')) signingConfig signingConfigs.release
            else signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
